<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Ancœur — Site en construction</title>
<meta name="description" content="Le site monacoeur.fr est en cours de construction. Revenez bientôt !">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
<style>
  :root {
    --bg-start: #fdf2f4;
    --bg-end: #fbe4e9;
    --ink: #3a2a2e;
    --ink-soft: #6b5459;
    --accent: #c9506a;
    --accent-dark: #a13a52;
    --card-bg: rgba(255, 255, 255, 0.6);
    --border: rgba(201, 80, 106, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-start: #241417;
      --bg-end: #1a0f12;
      --ink: #f3e6e8;
      --ink-soft: #c7aab0;
      --accent: #e8829a;
      --accent-dark: #f0a5b7;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border: rgba(232, 130, 154, 0.25);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Georgia", "Iowan Old Style", "Palatino Linotype", serif;
    color: var(--ink);
    background: radial-gradient(circle at 50% 20%, var(--bg-end), var(--bg-start) 70%);
    padding: 24px;
    overflow-x: hidden;
  }

  .card {
    max-width: 560px;
    width: 100%;
    text-align: center;
    padding: 56px 40px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    backdrop-filter: blur(6px);
    box-shadow: 0 20px 60px rgba(161, 58, 82, 0.08);
  }

  .heart {
    font-size: 2.5rem;
    display: inline-block;
    animation: beat 1.8s ease-in-out infinite;
    margin-bottom: 8px;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.15); }
    30% { transform: scale(1); }
    45% { transform: scale(1.1); }
    60% { transform: scale(1); }
  }

  h1 {
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0 0 12px;
    color: var(--accent-dark);
  }

  .subtitle {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    margin: 0 0 32px;
  }

  p {
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .divider {
    width: 48px;
    height: 2px;
    background: var(--accent);
    opacity: 0.5;
    margin: 28px auto;
    border-radius: 2px;
  }

  a.contact {
    color: var(--accent-dark);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    padding-bottom: 2px;
    transition: opacity 0.2s ease;
  }

  a.contact:hover {
    opacity: 0.7;
  }

  footer {
    margin-top: 32px;
    font-size: 0.8rem;
    color: var(--ink-soft);
    opacity: 0.7;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="heart" aria-hidden="true">❤️</div>
    <h1>Mon Ancœur</h1>
    <p class="subtitle">Site en construction</p>
    <p>Nous préparons quelque chose avec soin.</p>
    <p>Ce site sera bientôt disponible — merci de votre patience.</p>
    <div class="divider"></div>
    <p>
      Pour toute question, contactez-nous à<br>
      <a class="contact" href="mailto:contact@monacoeur.fr">contact@monacoeur.fr</a>
    </p>
    <footer>&copy; 2026 Mon Ancœur</footer>
  </main>
</body>
</html>
